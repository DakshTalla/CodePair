# Only Redis runs under compose. The server and web app run on the host with
# Node, and the sandbox containers are started on demand by the server.
#
# WHY port 6380 on the host: 6379 is often taken by another local Redis, and
# binding to 127.0.0.1 keeps the database off the local network.
services:
  redis:
    image: redis:7-alpine
    container_name: codepair-redis
    ports:
      - "127.0.0.1:6380:6379"
    # Append-only file so room state survives a Redis restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
